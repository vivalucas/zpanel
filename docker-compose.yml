services:
  zpanel:
    image: 'vivalucas/zpanel:1.0.7'
    container_name: zpanel
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
    ports:
      - 127.0.0.1:6521:6521
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6521/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
