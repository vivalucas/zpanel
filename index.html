<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg?no-inline" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5266eb" />
    <title>ZPanel</title>
    <style>
      :root {
        --startup-background: #111827;
        --startup-ink: #ffffff;
        background: var(--document-background, var(--startup-background));
        color-scheme: dark;
      }
      :root[data-startup-tone='light'] {
        --startup-background: #eef5ff;
        --startup-ink: #202733;
      }
    </style>
    <script>
      // Apply a non-identifying brightness hint before styles or app modules can paint.
      // Never restore the private home snapshot or a wallpaper URL before authentication.
      (() => {
        const root = document.documentElement
        let preference = 'auto'
        let tone
        try {
          preference = JSON.parse(localStorage.getItem('zpanel-preferences'))?.state?.theme || 'auto'
        } catch {}
        const dark = preference === 'dark' || (preference === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = root.dataset.theme
        const home = !location.hash || /^#\/(?:\?|$)/.test(location.hash)
        try { tone = localStorage.getItem('zpanel-startup-tone') } catch {}
        root.dataset.startupTone = tone === 'light' ? 'light' : 'dark'
        if (!home) root.style.setProperty('--document-background', dark ? '#111827' : '#eef5ff')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
